name: "App release"
on:
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the release in the apps repository
        required: true
        type: string
      app-version:
        description: Released version of the app
        required: true
        type: string

permissions:
  contents: read

jobs:
  # One job per variant: build-app.sh builds every variant in one process and
  # stops at the first failure.
  determine_variants:
    runs-on: ubuntu-latest
    outputs:
      app-name: ${{ steps.app.outputs.name }}
      variants: ${{ steps.variants.outputs.list }}
    steps:
      - name: Determine APP_NAME from ${{ github.repository }}
        id: app
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          NAME=$(sed -nE 's/.*apps-(.+)$/\1/p' <<<"${REPO}")
          if [ -z "${NAME}" ]; then
            echo "::error::could not derive an App name from ${REPO}"
            exit 1
          fi
          echo "name=${NAME}" >>"$GITHUB_OUTPUT"

      - name: Checkout app-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FLECS-Technologies/app-sdk
          path: app-sdk
          ref: main

      - name: Checkout ${{ steps.app.outputs.name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          ref: ${{ inputs.release-tag }}
          submodules: recursive

      - name: Collect variants
        id: variants
        env:
          APP_VERSION: ${{ inputs.app-version }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY }}
        run: |
          set -eu
          LIST=$(app-sdk/scripts/buildable-variants.sh app "${APP_VERSION}")
          JSON=$(jq -Rsc 'split("\n") | map(select(length > 0))' <<<"${LIST}")
          if [ "${JSON}" = "[]" ]; then
            echo "::error::no variant of this App can be built at ${APP_VERSION}"
            exit 1
          fi
          echo "Building variants: ${JSON}"
          echo "list=${JSON}" >>"$GITHUB_OUTPUT"

  upload_app_image:
    needs: [determine_variants]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.determine_variants.outputs.variants) }}
    steps:
      - name: Checkout app-sdk for build script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FLECS-Technologies/app-sdk
          path: app-sdk
          ref: main

      - name: Checkout app repo for building ${{ needs.determine_variants.outputs.app-name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ needs.determine_variants.outputs.app-name }}
          ref: ${{ inputs.release-tag }}
          submodules: recursive

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Build and publish ${{ matrix.variant }} with build script
        env:
          APP_NAME: ${{ needs.determine_variants.outputs.app-name }}
          APP_VERSION: ${{ inputs.app-version }}
          MATRIX_VARIANT: ${{ matrix.variant }}
          DOCKER_USER: ${{ vars.FLECS_REGISTRY_TOKEN }}
          DOCKER_PASSWORD: ${{ secrets.FLECS_REGISTRY_PASSWORD }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY }}
          PRIVATE_REGISTRY_USER: ${{ vars.PRIVATE_REGISTRY_USER }}
          PRIVATE_REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
        run: |
          set -eu
          app-sdk/build-app.sh \
            --app "${APP_NAME}" \
            --version "${APP_VERSION}" \
            --variant "${MATRIX_VARIANT}" \
            --push \
            --image-only

  trigger-app-release:
    needs: [determine_variants, upload_app_image]
    uses: FLECS-Technologies/app-sdk/.github/workflows/trigger_app_release.yml@main
    with:
      release-tag: ${{ inputs.release-tag }}
      app-version: ${{ inputs.app-version }}
    secrets:
      FLECS_WORKFLOW_AUTOMATION_KEY: ${{ secrets.FLECS_WORKFLOW_AUTOMATION_KEY }}
      FLECS_WORKFLOW_AUTOMATION_CLIENT_ID: ${{ secrets.FLECS_WORKFLOW_AUTOMATION_CLIENT_ID }}
